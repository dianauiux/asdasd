 գրկի ու ասի՝ այս անգամ ես քո կողքին եմ։\n\nՄենք այնքան ենք սովորել ուժեղ լինել, որ երբեմն մոռանում ենք՝ մենք էլ ենք մարդ։\n\nՈւ գիտե՞ս՝ միշտ չէ, որ պետք է ամեն ինչ միայնակ հաղթահարես։\n\nԴու էլ իրավունք ունես հոգնելու։ Դու էլ արժանի ես հոգատարության»։", "source_file": "scripts/motivation/MOT-01.md"}, {"id": "MOT-02", "title": "Իսկ դու ե՞րբ ես ապրելու", "primary_category": "Motivation", "secondary_topic": "Personal & Life", "duration_target": "25–30", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Իսկ դու ե՞րբ ես վերջապես ապրելու քեզ համար։\n\nԵրբ վարկերդ փակե՞ս։\n\nԵրբ երեխաներդ մեծանա՞ն։\n\nԵրբ աշխատանքում ամեն ինչ կարգավորվի՞։\n\nՄենք անընդհատ սպասում ենք մի օրվա, երբ վերջապես ժամանակ կունենանք մեզ համար։\n\nԲայց տարիներն անցնում են։\n\nՈւ մի օր կարող ես հասկանալ, որ բոլորի մասին մտածել ես, բացի քեզանից։\n\nԵս չեմ ասում՝ թող ամեն ինչ ու գնա։\n\nՊարզապես հիշիր՝ քո ցանկություններն էլ են կարևոր։\n\nԿյանքդ միայն պարտականություններից չպետք է կազմված լինի։ Քեզ համար էլ մի փոքր տեղ թող»։", "source_file": "scripts/motivation/MOT-02.md"}, {"id": "MOT-03", "title": "Քո կյանքը մրցույթ չէ", "primary_category": "Motivation", "secondary_topic": "Personal & Life", "duration_target": "25–30", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Գիտե՞ս՝ ինչքան հաճախ ենք մեզ դժբախտ զգում՝ ուրիշների կյանքին նայելով։\n\nՄեկն արդեն տուն է գնել։\n\nՄյուսը սեփական բիզնեսն ունի։\n\nԵրրորդն ամեն ամիս ճանապարհորդում է։\n\nՈւ դու սկսում ես մտածել՝ իսկ ես ի՞նչ եմ արել իմ կյանքում։\n\nԲայց դու չգիտես՝ ինչ ճանապարհ է անցել այդ մարդը։\n\nՈւ նա էլ չգիտի՝ ինչ դժվարությունների միջով ես անցել դու։\n\nՔո կյանքը մրցույթ չէ։\n\nԴու չես ուշացել։\n\nՊարզապես քո ճանապարհն ուրիշ է։\n\nՈւ պետք չէ ուրիշի հաջողության պատճառով մոռանալ քո անցած ճանապարհը»։", "source_file": "scripts/motivation/MOT-03.md"}, {"id": "MOT-04", "title": "Այն մարդը, ում նախկինում երազում էիր դառնալ", "primary_category": "Motivation", "secondary_topic": "Personal & Life", "duration_target": "25–30", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Մի պահ մտածիր։\n\nԳուցե այսօր դժգոհ ես քեզանից։\n\nՄտածում ես՝ դեռ բավականաչափ հաջողակ չեմ, դեռ շատ բան չեմ հասցրել։\n\nԲայց հիշո՞ւմ ես քեզ հինգ տարի առաջ։\n\nԱյն ժամանակ ինչի՞ մասին էիր երազում։\n\nԳուցե այսօր ունես բաներ, որոնք այն ժամանակ անհասանելի էին թվում։\n\nՈւղղակի այնքան ես կենտրոնացել հաջորդ նպատակիդ վրա, որ մոռացել ես ուրախանալ արդեն ձեռք բերածով։\n\nԵրբեմն կանգ առ ու նայիր, թե որքան ճանապարհ ես անցել։\n\nԳուցե այսօրվա դու հենց այն մարդն է, ում նախկինում երազում էիր դառնալ»։", "source_file": "scripts/motivation/MOT-04.md"}, {"id": "MOT-05", "title": "Մի օր քեզ էլ ընտրիր", "primary_category": "Motivation", "secondary_topic": "Relationships", "duration_target": "25–30", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Քանի՞ անգամ ես ասել՝ լավ, այս անգամ էլ ես կհարմարվեմ։\n\nԼռել ես, երբ ինչ-որ բան քեզ ցավեցրել է։\n\nՀամաձայնել ես, երբ իրականում չէիր ուզում։\n\nՄիայն թե ինչ-որ մեկը չնեղանա։\n\nՈւ գիտե՞ս՝ ամենացավալին որն է։\n\nՈր երբեմն ուրիշներին չկորցնելու համար կամաց-կամաց կորցնում ենք ինքներս մեզ։\n\nԲարի լինելը չի նշանակում միշտ զիջել։\n\nՄարդկանց սիրելը չի նշանակում մոռանալ քեզ։\n\nՄի օր փորձիր ընտրել նաև քեզ։\n\nԴա եսասիրություն չէ։ Դա սեփական կյանքդ հարգելու ձևերից մեկն է»։", "source_file": "scripts/motivation/MOT-05.md"}, {"id": "MOT-06", "title": "Մի՛ կորցրու քեզ ուրիշներին դուր գալու համար", "primary_category": "Motivation", "secondary_topic": "Personal & Life", "duration_target": "25", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Գիտե՞ս՝ ինչպես կարող ես կամաց-կամաց կորցնել ինքդ քեզ։\n\nԵրբ անընդհատ փորձում ես բոլորին դուր գալ։\n\nՄեկի համար փոխում ես որոշումներդ, մյուսի համար՝ ցանկություններդ։ Լռում ես, երբ իրականում ասելիք ունես։\n\nՈւ մի օր հասկանում ես, որ բոլորի սպասելիքներով ապրելիս մոռացել ես քո մասին։\n\nԵս կուզեի սա շատ ավելի շուտ հասկանալ։\n\nՊարտադիր չէ բոլորին դուր գալ։ Կարևոր է, որ քո ընտրած կյանքում դու քեզ լավ զգաս։»", "source_file": "scripts/motivation/MOT-06.md"}, {"id": "MOT-07", "title": "Աշխատանքը միշտ կլինի", "primary_category": "Motivation", "secondary_topic": "Career & Work", "duration_target": "25–30", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Գիտե՞ս՝ ինչի՞ համար կարող ես մի օր ամենաշատը ափսոսալ։\n\nԱյն պահերի, որոնք բաց ես թողել՝ մտածելով, որ դեռ կհասցնես։\n\nԱյսօր շատ աշխատանք ունես։ Վաղը՝ կարևոր հանդիպում։ Հետո՝ նոր նպատակներ։\n\nՈւ այդպես անընդհատ ինչ-որ բան ես հետաձգում։\n\nՀարազատներիդ հետ անցկացնելու ժամանակը, երեխայիդ հետ խաղալը, նույնիսկ ինքդ քեզ մի փոքր հանգիստ տալը։\n\nԱշխատանքը կարևոր է։ Ես էլ եմ շատ աշխատում։\n\nԲայց մի բան եմ հասկացել։\n\nԱշխատանքը միշտ էլ կլինի։ Իսկ որոշ պահեր կյանքում ընդամենը մեկ անգամ են լինում։»", "source_file": "scripts/motivation/MOT-07.md"}, {"id": "MOT-08", "title": "Մի՛ սպասիր, մինչև պատրաստ լինես", "primary_category": "Motivation", "secondary_topic": "Career & Work", "duration_target": "25", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Քանի՞ անգամ ես հետաձգել ինչ-որ բան՝ մտածելով, որ դեռ պատրաստ չես։\n\nԴեռ մի քիչ պետք է սովորեմ, մի քիչ փորձ հավաքեմ, հետո կսկսեմ։\n\nՈւ անցնում են ամիսներ, երբեմն նույնիսկ տարիներ։\n\nԲայց գիտե՞ս՝ ինչ եմ հասկացել։\n\nՄենք շատ հաճախ ուզում ենք վստահ լինել մեր ուժերին, մինչև առաջին քայլն անելը։\n\nՄինչդեռ այդ վստահությունը գալիս է հենց փորձելու ընթացքում։\n\nՊետք չէ ամեն ինչ իմանալ սկսելու համար։ Երբեմն պետք է պարզապես սկսել, որ կարողանաս սովորել։\n\nՄի՛ թող, որ պատրաստ չլինելու զգացողությունը տարիներով կանգնեցնի քեզ»։", "source_file": "scripts/motivation/MOT-08.md"}, {"id": "MOT-09", "title": "Սովորիր հեռանալ", "primary_category": "Motivation", "secondary_topic": "Relationships", "duration_target": "25–30", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Երբեմն ամենադժվար որոշումը հեռանալն է այն մարդկանցից, որոնց շատ ես սիրում։\n\nՈրովհետև անընդհատ մտածում ես՝ գուցե փոխվեն, գուցե մի օր հասկանան, թե որքան կարևոր են քեզ համար։\n\nՈւ շարունակում ես ներել, սպասել, փորձել ամեն ինչ շտկել։\n\nԲայց մի օր հասկանում ես, որ հարաբերությունը միայն մեկ մարդու ջանքերով պահել հնարավոր չէ։\n\nԵրբեմն հեռանալը պարտություն չէ։\n\nԴա այն պահն է, երբ վերջապես սկսում ես հարգել նաև ինքդ քեզ։\n\nՈւ հիշիր՝ դու էլ ես արժանի այն հոգատարությանը, որը տալիս ես ուրիշներին»։", "source_file": "scripts/motivation/MOT-09.md"}, {"id": "MOT-10", "title": "Իսկ եթե փորձեի՞", "primary_category": "Motivation", "secondary_topic": "Personal & Life", "duration_target": "25", "status": "Draft — ready to review", "format": "Talking head / voiceover", "script": "«Գիտե՞ս՝ ինչն է ինձ երբեմն ավելի շատ վախեցնում, քան անհաջողությունը։\n\nԱյն միտքը, որ տարիներ հետո կարող եմ ինձ հարցնել՝ իսկ եթե փորձեի՞։\n\nԵթե համարձակվեի սկսել այն գործը, որի մասին երկար մտածում էի։\n\nԵթե չվախենայի ուրիշների կարծիքից։\n\nԵթե մի անգամ էլ հավատայի իմ ուժերին։\n\nԻհարկե, ամեն փորձ հաջողությամբ չի ավարտվում։\n\nԲայց նույնիսկ սխալվելուց կարող ես ինչ-որ բան սովորել։\n\nԱվելի լավ է մի օր հիշես, որ փորձել ես, քան տարիներ շարունակ մտածես, թե ինչ կլիներ, եթե համարձակվեիր։»", "source_file": "scripts/motivation/MOT-10.md"}]};const cats=DATA.categories;let selectedTab='Motivation',selectedId=DATA.reels[0].id;const el=id=>document.getElementById(id);function e(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function draw(){el('tabs').innerHTML=cats.map(c=>`<button class="tab ${c.tab===selectedTab?'active':''}" data-t="${e(c.tab)}">${e(c.tab)}${c.current_items?' · '+c.current_items:''}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{selectedTab=b.dataset.t;selectedId=null;draw()});let q=el('q').value.toLowerCase();let cat=cats.find(c=>c.tab===selectedTab);let list=DATA.reels.filter(x=>x.primary_category===cat.category_key).filter(x=>(x.title+' '+x.script+' '+x.secondary_topic).toLowerCase().includes(q));el('count').textContent=`${list.length} Reel`;if(!list.length){el('layout').innerHTML=`<div class="empty wide"><b>${e(selectedTab)}</b>${q?'Այս որոնմամբ նյութ չկա։':'Այս բաժնի սցենարները դեռ չեն ավելացվել։'}</div>`;return}if(!selectedId||!list.some(x=>x.id===selectedId))selectedId=list[0].id;let cur=list.find(x=>x.id===selectedId);el('layout').innerHTML=`<div class="list">${list.map(x=>`<button class="card ${x.id===selectedId?'active':''}" data-id="${e(x.id)}"><span class="id">${e(x.id)}</span><strong>${e(x.title)}</strong><span class="pill">${e(x.secondary_topic)}</span> <span class="pill">${e(x.duration_target)} վրկ.</span></button>`).join('')}</div><article class="reader"><span class="id">${e(cur.id)} · MOTIVATION</span><h2>${e(cur.title)}</h2><div class="detail">${e(cur.secondary_topic)} · ${e(cur.duration_target)} վրկ. · Սցենար</div><div class="script" id="script">${e(cur.script)}</div><div class="actions"><button class="action main" id="copy">Պատճենել սցենարը</button><button class="action" id="font">Մեծացնել տառերը</button></div></article>`;document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.id;draw()});el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(cur.script);el('copy').textContent='Պատճենված է'}catch(_){let t=document.createElement('textarea');t.value=cur.script;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();el('copy').textContent='Պատճենված է'}};el('font').onclick=()=>{let t=el('script');t.style.fontSize=t.style.fontSize==='24px'?'19px':'24px'}}el('q').addEventListener('input',draw);draw();
</script></body></html>
