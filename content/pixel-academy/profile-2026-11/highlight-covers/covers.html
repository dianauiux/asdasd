<!doctype html><html><head><meta charset="utf-8">
<style>
:root{--grad-a:#2A0B3D;--grad-b:#C2185B;--grad-c:#FF6A00; /* PLACEHOLDER: PDA-smm gradient */}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#555;display:flex;gap:30px;flex-wrap:wrap;padding:30px}
.c{width:1080px;height:1920px;background:linear-gradient(150deg,var(--grad-a),var(--grad-b) 55%,var(--grad-c));display:flex;align-items:center;justify-content:center}
.c svg{width:420px;height:420px;fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
</style></head><body>
<!-- 1 Սկսիր այստեղ: square frame emblem (brand) + arrow -->
<div class="c" id="h1"><svg viewBox="0 0 48 48"><rect x="8" y="8" width="32" height="32"/><path d="M18 24h12M25 19l5 5-5 5"/></svg></div>
<!-- 2 Դասընթացներ: laptop -->
<div class="c" id="h2"><svg viewBox="0 0 48 48"><rect x="10" y="12" width="28" height="19" rx="2"/><path d="M6 36h36M21 21.5l-3 0M22 18l5 3.5-5 3.5z"/></svg></div>
<!-- 3 Ուսանողներ: grid of works -->
<div class="c" id="h3"><svg viewBox="0 0 48 48"><rect x="9" y="9" width="12" height="12" rx="1.5"/><rect x="27" y="9" width="12" height="12" rx="1.5"/><rect x="9" y="27" width="12" height="12" rx="1.5"/><path d="M33 27l1.8 3.7 4 .6-2.9 2.8.7 4-3.6-1.9-3.6 1.9.7-4-2.9-2.8 4-.6z"/></svg></div>
<!-- 4 Կարծիքներ: speech bubble with quote -->
<div class="c" id="h4"><svg viewBox="0 0 48 48"><path d="M9 11h30v20H22l-8 7v-7H9z"/><path d="M18 19.5v3.5M18 19.5h3M26 19.5v3.5M26 19.5h3"/></svg></div>
<!-- 5 Հարցեր: question mark in circle -->
<div class="c" id="h5"><svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="15"/><path d="M19.5 19.5a4.5 4.5 0 1 1 6.3 4.1c-1.2.6-1.8 1.4-1.8 2.7v1"/><path d="M24 32.2v.1"/></svg></div>
</body></html>
