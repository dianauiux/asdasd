<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}body{width:1080px;height:1350px;position:relative;overflow:hidden;background:#0b0b0c;font-family:Inter,sans-serif;color:#f4f1ec}
.ph{position:absolute;inset:0;background:url(photo.jpg) center 18%/cover}
.fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,12,0) 30%,rgba(11,11,12,.55) 52%,rgba(11,11,12,.96) 74%)}
.txt{position:absolute;left:72px;right:72px;bottom:96px}
.kick{font-size:26px;letter-spacing:.14em;text-transform:uppercase;color:#cfc8bf}
.q{font-family:Syne;font-weight:800;font-size:72px;line-height:1.02;margin-top:18px;letter-spacing:-.01em}
.list{margin-top:26px;display:flex;gap:12px;flex-wrap:wrap}
.list span{border:1.5px solid rgba(244,241,236,.4);border-radius:999px;padding:9px 18px;font-size:24px;font-weight:500}
.ans{margin-top:34px;font-family:Syne;font-weight:800;font-size:58px;line-height:1.05}
.ans b{color:#ff7a30}
.sig{position:absolute;top:56px;left:72px;font-size:22px;letter-spacing:.12em;text-transform:uppercase;color:#f4f1ec;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.dot{position:absolute;top:56px;right:72px;font-size:22px;color:#f4f1ec;text-shadow:0 1px 8px rgba(0,0,0,.7)}
</style></head><body><div class="ph"></div><div class="fade"></div>
<div class="sig">Dee · Product Designer</div><div class="dot">1 / 2</div>
<div class="txt"><div class="kick">"Is this normal?"</div><div class="q">The "small"<br>test task:</div>
<div class="list"><span>4 screens</span><span>Clickable prototype</span><span>Team presentation</span><span>Deadline: Monday</span></div>
<div class="ans">That's not a test.<br><b>That's a project.</b></div></div></body></html>
