<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;background:#0d0d0f;color:#f4f1ec;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;left:50%;top:58%;width:900px;height:600px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(255,122,48,.28),transparent 65%)}
.top{position:absolute;top:90px;left:90px;font-size:28px;letter-spacing:.18em;text-transform:uppercase;color:#8a857e}
.time{position:absolute;top:220px;left:84px;font-family:Syne;font-weight:700;font-size:300px;line-height:1;letter-spacing:-.04em}
.time span{color:#ff7a30}
.am{font-size:90px;color:#8a857e;letter-spacing:0}
.lap{position:absolute;left:50%;top:760px;transform:translateX(-50%);width:640px}
.scr{height:380px;border-radius:18px 18px 6px 6px;background:#1b1b20;border:10px solid #2a2a30;padding:22px;display:grid;grid-template-columns:110px 1fr;gap:18px;box-shadow:0 0 120px rgba(255,122,48,.25)}
.side{display:flex;flex-direction:column;gap:12px}.side i{display:block;height:12px;border-radius:4px;background:#34343b}
.art{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.art b{display:block;border-radius:10px;background:#f4f1ec}
.art b:nth-child(2){background:#ff7a30}
.base{height:22px;margin:0 -50px;background:#2a2a30;border-radius:0 0 22px 22px}
.foot{position:absolute;bottom:80px;left:90px;right:90px;display:flex;justify-content:space-between;font-size:30px;color:#8a857e}
.foot strong{color:#f4f1ec;font-weight:500}
</style></head><body>
<div class="glow"></div>
<div class="top">Yerevan · everyone is asleep</div>
<div class="time">1<span>:</span>40<span class="am"> am</span></div>
<div class="lap"><div class="scr"><div class="side"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="art"><b></b><b></b><b></b></div></div><div class="base"></div></div>
<div class="foot"><span>New York: <strong>4:40 pm</strong></span><span><strong>Dee</strong> · Product Designer</span></div>
</body></html>
